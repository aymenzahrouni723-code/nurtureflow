<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NurtureFlow — QR Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a0a12 0%, #2d1420 30%, #1a1025 60%, #0d1117 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }
    body::before {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #c44569, transparent);
      top: -100px; right: -100px;
    }
    body::after {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #8e6c88, transparent);
      bottom: -80px; left: -80px;
      animation-delay: -4s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #c44569, #8e6c88);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 16px rgba(196,69,105,0.4);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #c44569, #e8a0b5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 36px;
      letter-spacing: 0.02em;
    }

    .subtitle-ar {
      direction: rtl;
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }

    .qr-wrapper {
      background: white;
      border-radius: 20px;
      padding: 24px;
      display: inline-block;
      margin: 0 auto 32px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      position: relative;
      animation: qrPulse 3s ease-in-out infinite;
    }

    @keyframes qrPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.2), 0 0 0 0 rgba(196,69,105,0); }
      50% { box-shadow: 0 8px 32px rgba(0,0,0,0.2), 0 0 0 8px rgba(196,69,105,0.08); }
    }

    .qr-wrapper::after {
      content: '🤱';
      position: absolute;
      bottom: -16px;
      right: -16px;
      font-size: 32px;
      background: linear-gradient(135deg, #c44569, #8e6c88);
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(196,69,105,0.4);
    }

    #qr-code {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qr-code canvas, #qr-code img {
      border-radius: 8px !important;
    }

    .scan-text {
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .scan-desc {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .url-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s;
      margin-bottom: 24px;
    }

    .url-box:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(196,69,105,0.3);
    }

    .url-box:active {
      transform: scale(0.98);
    }

    .url-text {
      color: #e8a0b5;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
    }

    .copy-icon {
      color: rgba(255,255,255,0.4);
      font-size: 18px;
      transition: color 0.2s;
    }

    .url-box:hover .copy-icon { color: #c44569; }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 8px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .feature-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(196,69,105,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .feature-text {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #c44569, #8e6c88);
      color: white;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(196,69,105,0.4);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .print-btn {
      margin-top: 16px;
      padding: 12px 28px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: rgba(255,255,255,0.7);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .print-btn:hover {
      background: rgba(255,255,255,0.14);
      color: white;
    }

    @media print {
      body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
        background: linear-gradient(135deg, #1a0a12 0%, #2d1420 30%, #1a1025 60%, #0d1117 100%) !important;
        padding: 40px;
      }
      body::before, body::after { display: none; }
      .card {
        background: rgba(255,255,255,0.06) !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        box-shadow: none !important;
        border: 1px solid rgba(255,255,255,0.12);
      }
      .qr-wrapper {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .print-btn, .toast, .copy-icon { display: none !important; }
      @page { margin: 0; size: A4 portrait; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-container">
      <div class="logo-icon">👶</div>
      <span class="logo-text">NurtureFlow</span>
    </div>

    <p class="subtitle-ar">من الحياة الزوجية إلى الأبوة</p>
    <p class="subtitle">De la conjugalité à la parentalité</p>

    <div class="qr-wrapper">
      <div id="qr-code"></div>
    </div>

    <p class="scan-text">📱 Scannez pour accéder</p>
    <p class="scan-desc">
      Ouvrez l'appareil photo de votre téléphone<br>
      et pointez-le vers le QR code
    </p>

    <div class="url-box" onclick="copyURL()" title="Cliquer pour copier">
      <span class="url-text" id="app-url"></span>
      <span class="copy-icon">📋</span>
    </div>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">📊</div>
        <span class="feature-text">Évaluations</span>
      </div>
      <div class="feature">
        <div class="feature-icon">🩺</div>
        <span class="feature-text">Sage-Femme</span>
      </div>
      <div class="feature">
        <div class="feature-icon">📖</div>
        <span class="feature-text">Bibliothèque</span>
      </div>
      <div class="feature">
        <div class="feature-icon">📈</div>
        <span class="feature-text">Suivi</span>
      </div>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ Imprimer le QR Code</button>
  </div>

  <div class="toast" id="toast">✅ Lien copié !</div>

  <script>
    // Deployed app URL
    const appURL = 'https://nurtureflow-b24l.onrender.com/#home';
    document.getElementById('app-url').textContent = 'nurtureflow-b24l.onrender.com';

    // Generate QR Code
    new QRCode(document.getElementById('qr-code'), {
      text: appURL,
      width: 200,
      height: 200,
      colorDark: '#1a0a12',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    // Copy URL function
    function copyURL() {
      navigator.clipboard.writeText(appURL).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }
  </script>
</body>
</html>
